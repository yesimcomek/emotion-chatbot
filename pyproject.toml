[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-chatbot"
version = "0.2.0"
description = "German emotion detection: rule-based vs. classical ML vs. transformer, with a small chatbot on top."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: German",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # the rule-based core is dependency-free

[project.optional-dependencies]
eval = ["numpy>=1.26", "pyarrow>=15", "scikit-learn>=1.4"]
bert = [
    "emotion-chatbot[eval]",
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.30",
]
demo = ["emotion-chatbot[bert]", "gradio>=4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
emotion-chatbot = "emotion_chatbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/emotion_chatbot/lexicon.py" = ["E501"]  # word lists
